name: CI

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write
    checks: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
                  cache: true
                  cache-dependency-path: "**/*.csproj"

            - name: Test
              run: >
                  dotnet test Dsposal.Flow.Tests
                  --settings coverlet.runsettings
                  --logger "trx;LogFileName=output.trx"
                  --collect:"XPlat Code Coverage"
                  --results-directory "TestResults"

            - name: Code Coverage Report
              uses: irongut/CodeCoverageSummary@v1.3.0
              with:
                  filename: TestResults/**/*.cobertura.xml
                  badge: true
                  fail_below_min: true
                  format: markdown
                  hide_branch_rate: false
                  hide_complexity: true
                  indicators: true
                  output: both

            - name: Test Report
              uses: dorny/test-reporter@v3
              id: process-test
              if: ${{ !cancelled() }}
              with:
                name: Tests
                path: TestResults/**/*.trx
                reporter: dotnet-trx
                use-actions-summary: false

            - name: Build Comment & Set Action Summary
              if: ${{ !cancelled() }}
              run: |
                {
                    cat code-coverage-results.md || echo "_Coverage report unavailable._"
                    echo
                    cat "${{ steps.process-test.outputs.summary_file }}" || echo "_No test report available._"
                } > pr-comment.md
                cat pr-comment.md > "$GITHUB_STEP_SUMMARY"

            - name: Add Coverage PR Comment
              uses: marocchino/sticky-pull-request-comment@v3.0.5
              if: github.event_name == 'pull_request'
              with:
                  recreate: true
                  path: pr-comment.md
