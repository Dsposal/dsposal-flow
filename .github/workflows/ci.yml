name: CI

# Inspired by https://github.com/SeanKilleen/ExampleTestResultsWithGithubActions/blob/main/.github/workflows/build.yaml

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write
    checks: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
                  cache: true
                  cache-dependency-path: "**/*.csproj"

            - name: Test
              run: >
                  dotnet test Dsposal.Flow.Tests
                  --settings coverlet.runsettings
                  --logger "trx;LogFileName=output.trx"
                  --collect:"XPlat Code Coverage"
                  --results-directory "TestResults"

            - name: Combine Coverage Reports # This is because one report is produced per project, and we want one result for all of them.
              uses: danielpalme/ReportGenerator-GitHub-Action@v5.5.11
              with:
                  reports: "TestResults/**/*.cobertura.xml" # REQUIRED # The coverage reports that should be parsed (separated by semicolon). Globbing is supported.
                  targetdir: "${{ github.workspace }}" # REQUIRED # The directory where the generated report should be saved.
                  reporttypes: "Cobertura" # The output formats and scope (separated by semicolon) Values: Badges, Clover, Cobertura, CsvSummary, Html, Html_Dark, Html_Light, Html_BlueRed, HtmlChart, HtmlInline, HtmlInline_AzurePipelines, HtmlInline_AzurePipelines_Dark, HtmlInline_AzurePipelines_Light, HtmlSummary, JsonSummary, Latex, LatexSummary, lcov, MarkdownSummary, MarkdownSummaryGithub, MarkdownDeltaSummary, MHtml, PngChart, SonarQube, TeamCitySummary, TextSummary, TextDeltaSummary, Xml, XmlSummary
                  verbosity: "Info" # The verbosity level of the log messages. Values: Verbose, Info, Warning, Error, Off
                  title: "Code Coverage" # Optional title.
                  tag: "${{ github.run_number }}_${{ github.run_id }}" # Optional tag or build version.
                  customSettings: "" # Optional custom settings (separated by semicolon). See: https://github.com/danielpalme/ReportGenerator/wiki/Settings.
                  toolpath: "reportgeneratortool" # Default directory for installing the dotnet tool.

            - name: Code Coverage Report
              uses: irongut/CodeCoverageSummary@v1.3.0
              with:
                  filename: Cobertura.xml
                  badge: true
                  fail_below_min: true
                  format: markdown
                  hide_branch_rate: false
                  hide_complexity: true
                  indicators: true
                  output: both

            - name: Test Report
              uses: dorny/test-reporter@v3
              id: process-test
              if: ${{ !cancelled() }}
              with:
                  name: Tests
                  path: TestResults/**/*.trx
                  reporter: dotnet-trx
                  use-actions-summary: false

            - name: Build Comment & Set Action Summary
              if: ${{ !cancelled() }}
              run: |
                  {
                      cat code-coverage-results.md || echo "_Coverage report unavailable._"
                      echo
                      cat "${{ steps.process-test.outputs.summary_file }}" || echo "_No test report available._"
                  } > pr-comment.md
                  cat pr-comment.md > "$GITHUB_STEP_SUMMARY"

            - name: Add Coverage PR Comment
              uses: marocchino/sticky-pull-request-comment@v3.0.5
              if: github.event_name == 'pull_request'
              with:
                  recreate: true
                  path: pr-comment.md
            #- name: Publish Test Results
            #  uses: EnricoMi/publish-unit-test-result-action@v2.16.1
            #  if: always()
            #  with:
            #    comment_mode: off
            #    trx_files: "${{ github.workspace }}/**/*.trx"
